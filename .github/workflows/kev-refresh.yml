# Refreshes the embedded CISA Known Exploited Vulnerabilities catalog.
#
# This overlay's failure direction is UNDER-reporting: a CVE CISA added after
# the catalog was generated carries no exploitation status, and a scan reports
# that silence as "not listed". CISA publishes several times a week, so a
# catalog refreshed only when someone remembers is a catalog that is usually
# wrong in the dangerous direction.
#
# It opens a pull request rather than pushing: the catalog is data the binary
# ships, every refresh is a release-affecting change, and the diff is the review
# — new entries land in place because tools/kev-gen sorts by CVE id.
name: KEV catalog refresh

on:
  schedule:
    - cron: "41 5 * * 2" # weekly, Tuesday 05:41 UTC (off the hour: shared runners are busiest there)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh the CISA KEV catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Regenerate from CISA's feed
        run: go run ./tools/kev-gen

      - name: Stop if nothing changed
        id: diff
        run: |
          if git diff --quiet -- internal/kev/catalog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "catalog already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- internal/kev/catalog
          fi

      # The catalog is parsed at startup and a malformed one costs the whole
      # overlay, so it must load before a PR is opened — a refresh that breaks
      # the build is worse than a stale catalog.
      - name: The regenerated catalog must load
        if: steps.diff.outputs.changed == 'true'
        run: go test ./internal/kev/ -count=1

      - name: Summarize the change
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          before=$(git show HEAD:internal/kev/catalog/cisa.yaml | grep -c '^  - id: ' || echo 0)
          after=$(grep -c '^  - id: ' internal/kev/catalog/cisa.yaml)
          echo "added=$((after - before))" >> "$GITHUB_OUTPUT"
          echo "total=$after" >> "$GITHUB_OUTPUT"
          {
            echo "### New CISA KEV entries"
            echo
            git diff -- internal/kev/catalog \
              | grep '^+  - id: ' | sed 's/^+  - id: /- /' || echo "_(entries changed without additions)_"
          } > /tmp/kev-body.md

      - name: Open the refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/kev-refresh
          base: main
          commit-message: |
            kev: refresh the known-exploited catalog (+${{ steps.summary.outputs.added }} entries)

            Regenerated by tools/kev-gen from CISA's feed. A CVE added after the
            last refresh carried no exploitation status until now, and a scan
            reported that silence as "CISA does not list it".
          title: "kev: refresh the known-exploited catalog (+${{ steps.summary.outputs.added }} entries)"
          body-path: /tmp/kev-body.md
          labels: dependencies
          delete-branch: true
